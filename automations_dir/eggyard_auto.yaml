- alias: "Sunset barn yard  lights on"
  trigger:
    - platform: sun
      event: sunset
      offset: "-01:00:00" # 1 hour before sunset
  condition: []
  action:
    - service: homeassistant.turn_on
      entity_id: switch.egg_yard_light

- alias: "Night Barn yard  lights off"
  trigger:
    - platform: time
      at: "00:30:00" # off at 11p
  condition: []
  action:
    - service: homeassistant.turn_off
      entity_id: switch.egg_yard_light
