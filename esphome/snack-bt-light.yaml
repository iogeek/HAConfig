switch:
  - platform: template
    name: "Govee String Lights"
    turn_on_action:
      - ble_client.ble_write:
          id: ${id}
          service_uuid: ${s_uuid}
          characteristic_uuid: ${c_uuid}
          # List of bytes to write.
          value: [0x33, 0x33, 0x01]  # 0x11
    turn_off_action:
      - ble_client.ble_write:
          id: ${id}
          service_uuid: ${s_uuid}
          characteristic_uuid: ${c_uuid}
          # List of bytes to write.
          value: [0x33, 0x33, 0x00]
